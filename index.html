<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Pendant MCP: a local-first companion app for a wearable AI pendant. Capture voice, photos and notes, then approve the on-device actions it proposes." />
  <meta name="theme-color" content="#0B0C0E" />
  <title>PENDANT MCP // Local-Only Companion</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />

  <!-- Tailwind Play CDN (no build step). Config must load right after the CDN script. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./src/tailwind.config.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body class="min-h-screen flex justify-center items-start sm:py-4">

  <!-- Phone-width industrial container -->
  <div id="app-shell" class="w-full max-w-[480px] min-h-screen sm:min-h-[844px] sm:h-[844px] bg-chassis sm:border sm:border-hairline sm:rounded-xl flex flex-col relative overflow-hidden shadow-2xl">

    <!-- Top brand & system bar -->
    <header class="px-4 py-3 border-b border-hairline bg-chassis flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2.5">
        <div id="status-led" class="w-2 h-2 rounded-full bg-muted" aria-hidden="true"></div>
        <span class="font-mono text-xs font-bold tracking-widest uppercase text-ink">PENDANT // MCP</span>
      </div>
      <span class="font-mono text-[10px] tracking-wider uppercase text-muted border border-hairline px-2 py-0.5 rounded">LOCAL-ONLY</span>
    </header>

    <!-- Scrollable viewport; the active tab is rendered here by src/ui/app.js -->
    <main id="main-content" class="flex-1 overflow-y-auto px-4 py-4 pb-24 space-y-4">
      <noscript>
        <p class="text-sm text-muted">Pendant MCP needs JavaScript enabled to run.</p>
      </noscript>
    </main>

    <!-- Persistent 4-tab bottom navigation -->
    <nav aria-label="Primary" class="absolute bottom-0 left-0 right-0 bg-surface border-t border-hairline px-2 py-2 grid grid-cols-4 gap-1 shrink-0 z-20">
      <button type="button" data-tab="feed" class="nav-btn relative flex flex-col items-center justify-center py-2 rounded-lg transition-colors text-ink bg-chassis border border-hairline" aria-current="page">
        <svg class="w-4 h-4 mb-1" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span class="font-mono text-[10px] uppercase tracking-wider">Feed</span>
      </button>
      <button type="button" data-tab="actions" class="nav-btn relative flex flex-col items-center justify-center py-2 rounded-lg transition-colors text-muted hover:text-ink border border-transparent">
        <span id="nav-action-badge" class="hidden absolute top-1.5 right-4 w-4 h-4 rounded-full bg-ink text-chassis font-mono text-[9px] font-bold flex items-center justify-center" aria-label="Pending actions">0</span>
        <svg class="w-4 h-4 mb-1" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span class="font-mono text-[10px] uppercase tracking-wider">Actions</span>
      </button>
      <button type="button" data-tab="insights" class="nav-btn relative flex flex-col items-center justify-center py-2 rounded-lg transition-colors text-muted hover:text-ink border border-transparent">
        <svg class="w-4 h-4 mb-1" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <span class="font-mono text-[10px] uppercase tracking-wider">Insights</span>
      </button>
      <button type="button" data-tab="vault" class="nav-btn relative flex flex-col items-center justify-center py-2 rounded-lg transition-colors text-muted hover:text-ink border border-transparent">
        <svg class="w-4 h-4 mb-1" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        <span class="font-mono text-[10px] uppercase tracking-wider">Vault</span>
      </button>
    </nav>

    <!-- Hidden file input for camera / snapshot capture -->
    <input id="snap-file-input" type="file" accept="image/*" capture="environment" class="hidden" aria-hidden="true" tabindex="-1" />

    <!-- Toast notification -->
    <div id="toast" role="status" aria-live="polite" class="pointer-events-none fixed sm:absolute bottom-20 left-4 right-4 bg-ink text-chassis px-3.5 py-2.5 rounded-lg font-mono text-xs font-medium shadow-lg opacity-0 translate-y-2 transition-all duration-200 z-40 flex items-center justify-between">
      <span id="toast-text"></span>
    </div>

    <!-- Panic wipe confirmation modal -->
    <div id="wipe-modal" role="dialog" aria-modal="true" aria-labelledby="wipe-title" class="hidden fixed sm:absolute inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
      <div class="w-full max-w-sm bg-surface border border-hairline rounded-xl p-5 space-y-4">
        <div class="flex items-center gap-2 text-alert">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          <h3 id="wipe-title" class="font-mono text-xs font-bold uppercase tracking-wider">Confirm Panic Wipe</h3>
        </div>
        <p class="text-sm text-muted leading-relaxed">
          This will permanently erase all local memories, pending actions, Markdown notes, and expense logs from this device's storage. This cannot be undone.
        </p>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button type="button" id="cancel-wipe-btn" class="py-2.5 px-3 rounded-lg border border-hairline bg-chassis text-ink font-mono text-xs uppercase hover:bg-surfaceHover transition-colors">Cancel</button>
          <button type="button" id="confirm-wipe-btn" class="py-2.5 px-3 rounded-lg bg-alert text-white font-mono text-xs font-bold uppercase hover:bg-red-600 transition-colors">Wipe All</button>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
